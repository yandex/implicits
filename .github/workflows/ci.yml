name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.2

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -v --build-tests --disable-xctest --sanitize=address

      - name: Run tests
        run: swift test -v --parallel --skip-build --disable-xctest --sanitize=address
        env:
          LSAN_OPTIONS: suppressions=Tests/lsan-suppressions.txt
          SWIFT_DETERMINISTIC_HASHING: 1

      - name: Install SwiftFormat
        if: success() || failure()
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          curl -fsSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$(cat .swiftformat-version)/swiftformat_linux.zip"
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          install /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat

      - name: SwiftFormat
        if: success() || failure()
        run: swiftformat --lint . --reporter github-actions-log
