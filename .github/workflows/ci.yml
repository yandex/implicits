name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.2

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -v

      - name: Run tests
        run: SWIFT_DETERMINISTIC_HASHING=1 swift test -v --parallel

      - name: Build Showcase (static analysis)
        run: swift build --target Showcase

      - name: Build ShowcaseDependency (static analysis)
        run: swift build --target ShowcaseDependency

      - name: Install SwiftFormat
        if: success() || failure()
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          curl -fsSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$(cat .swiftformat-version)/swiftformat_linux.zip"
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          install /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat

      - name: SwiftFormat
        if: success() || failure()
        run: swiftformat --lint . --reporter github-actions-log
